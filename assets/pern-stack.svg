<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195" role="img" aria-labelledby="title desc">
  <title id="title">PERN technology stack</title>
  <desc id="desc">PostgreSQL, Express, React and Node.js arranged as a minimal green technology stack.</desc>
  <rect x="1" y="1" width="298" height="193" rx="10" fill="#f6f8fa" stroke="#2da44e" stroke-width="2"/>
  <text x="24" y="31" fill="#57606a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">PERN STACK</text>
  <path d="M24 43H276" stroke="#d0d7de"/>

  <g transform="translate(24 59)">
    <rect width="54" height="54" rx="9" fill="#dafbe1" stroke="#2da44e"/>
    <text x="27" y="35" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700">P</text>
    <text x="27" y="75" text-anchor="middle" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9">Postgres</text>
  </g>
  <g transform="translate(90 59)">
    <rect width="54" height="54" rx="9" fill="#dafbe1" stroke="#2da44e"/>
    <text x="27" y="35" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700">E</text>
    <text x="27" y="75" text-anchor="middle" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9">Express</text>
  </g>
  <g transform="translate(156 59)">
    <rect width="54" height="54" rx="9" fill="#dafbe1" stroke="#2da44e"/>
    <text x="27" y="35" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700">R</text>
    <text x="27" y="75" text-anchor="middle" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9">React</text>
  </g>
  <g transform="translate(222 59)">
    <rect width="54" height="54" rx="9" fill="#dafbe1" stroke="#2da44e"/>
    <text x="27" y="35" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700">N</text>
    <text x="27" y="75" text-anchor="middle" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9">Node.js</text>
  </g>

  <path d="M51 151H249" stroke="#2da44e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="51" cy="151" r="4" fill="#2da44e"/>
  <circle cx="117" cy="151" r="4" fill="#2da44e"/>
  <circle cx="183" cy="151" r="4" fill="#2da44e"/>
  <circle cx="249" cy="151" r="4" fill="#2da44e"/>
  <text x="150" y="175" text-anchor="middle" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing=".6">DATABASE → API → UI → RUNTIME</text>
